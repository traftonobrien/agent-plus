<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520"><rect width="1600" height="520" fill="#07111f"/><style>text{font-family:Arial,sans-serif;fill:#e6edf7}.t{font-size:35px;font-weight:700}.h{font-size:25px;font-weight:700}.s{font-size:18px;fill:#b9c8d9}.b{fill:#10243b;stroke:#42b5d9;stroke-width:3}.a{stroke:#70e0b5;stroke-width:5;fill:none}</style><text x="70" y="75" class="t">Verification system</text><text x="70" y="110" class="s">Generated work becomes a claim only through independent, reviewable evidence.</text><g class="b"><rect x="70" y="200" width="260" height="135" rx="16"/><rect x="450" y="200" width="260" height="135" rx="16"/><rect x="830" y="200" width="260" height="135" rx="16"/><rect x="1210" y="200" width="260" height="135" rx="16"/></g><g class="a"><path d="M330 268H450M710 268H830M1090 268H1210"/></g><g text-anchor="middle"><text x="200" y="255" class="h">Maker</text><text x="200" y="285" class="s">Bounded artifact</text><text x="580" y="255" class="h">Evaluator</text><text x="580" y="285" class="s">Deterministic checks</text><text x="960" y="255" class="h">Fresh verifier</text><text x="960" y="285" class="s">Independent review</text><text x="1340" y="255" class="h">Human owner</text><text x="1340" y="285" class="s">Claim decision</text></g><text x="800" y="425" text-anchor="middle" class="h">Result: PASS, null result, or BLOCK</text><text x="800" y="460" text-anchor="middle" class="s">Document limits and one restartable next action.</text></svg>
