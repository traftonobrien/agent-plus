<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580"><rect width="1600" height="580" fill="#07111f"/><style>text{font-family:Arial,sans-serif;fill:#e6edf7}.t{font-size:35px;font-weight:700}.h{font-size:25px;font-weight:700}.s{font-size:19px;fill:#b9c8d9}.l{fill:#10243b;stroke-width:3}</style><text x="70" y="80" class="t">Route work by authority</text><text x="70" y="115" class="s">Use the lowest tier that can close the uncertainty safely.</text><g><rect class="l" stroke="#53b7e8" x="70" y="180" width="330" height="270" rx="18"/><rect class="l" stroke="#70e0b5" x="440" y="180" width="330" height="270" rx="18"/><rect class="l" stroke="#f4c868" x="810" y="180" width="330" height="270" rx="18"/><rect class="l" stroke="#f78c8c" x="1180" y="180" width="330" height="270" rx="18"/></g><g><text x="105" y="235" class="h">Tier 0 · Deterministic</text><text x="105" y="275" class="s">Counts · schemas · hashes · tests</text><text x="105" y="315" class="s">No scientific interpretation</text><text x="475" y="235" class="h">Tier 1 · Reversible help</text><text x="475" y="275" class="s">Extraction · classification · drafts</text><text x="475" y="315" class="s">Checked before use</text><text x="845" y="235" class="h">Tier 2 · Implementation</text><text x="845" y="275" class="s">Bounded code or integration</text><text x="845" y="315" class="s">Narrow acceptance check</text><text x="1215" y="235" class="h">Tier 3 · Fresh review</text><text x="1215" y="275" class="s">Leakage review · hard design</text><text x="1215" y="315" class="s">Never replaces evidence</text></g><text x="800" y="525" text-anchor="middle" class="s">Maker ≠ evaluator ≠ verifier ≠ human decision owner</text></svg>
