name: Validate Agent+ package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate types, lint and package
        run: |
          python3 -m pip install --user uv==0.11.28
          python3 - <<'PY_CHECKS'
          import os
          import runpy
          from pathlib import Path

          verifier = runpy.run_path("scripts/verify_release_candidate.py")
          verifier["_validate_candidate"](Path.cwd(), os.environ.copy(), public_output=True)
          PY_CHECKS
